name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build VulnCheck
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphone

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild             -project VulnCheck.xcodeproj             -scheme VulnCheck             -configuration Release             -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator'             CODE_SIGNING_ALLOWED=NO             clean build

      - name: Run unit tests
        run: |
          xcodebuild             -project VulnCheck.xcodeproj             -scheme VulnCheck             -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest'             test             CODE_SIGNING_ALLOWED=NO

      - name: Package simulator app
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path '*/Build/Products/Release-iphonesimulator/VulnCheck.app' -print -quit)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" VulnCheck-iOS-Simulator.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: VulnCheck-iOS-Simulator
          path: VulnCheck-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
