name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build VulnCheck
    runs-on: macos-26-intel
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select latest Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          test -f VulnCheck.xcodeproj/project.pbxproj

      - name: Build iOS device app
        run: |
          set -o pipefail
          xcodebuild             -project VulnCheck.xcodeproj             -scheme VulnCheck             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             clean build | tee build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/VulnCheck.app"
          test -d "$APP_PATH"
          rm -rf Payload VulnCheck.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/VulnCheck.app
          /usr/bin/zip -qry VulnCheck.ipa Payload
          test -s VulnCheck.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: VulnCheck-IPA-unsigned
          path: VulnCheck.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: VulnCheck-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
