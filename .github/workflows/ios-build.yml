name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build VulnCheck
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild             -project VulnCheck.xcodeproj             -scheme VulnCheck             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             clean build

      - name: Create unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/VulnCheck.app"
          test -d "$APP_PATH"
          rm -rf Payload VulnCheck.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry VulnCheck.ipa Payload
          test -f VulnCheck.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: VulnCheck-IPA-unsigned
          path: VulnCheck.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload app bundle
        uses: actions/upload-artifact@v5
        with:
          name: VulnCheck-iOS-App
          path: build/Build/Products/Release-iphoneos/VulnCheck.app
          if-no-files-found: error
          retention-days: 14
